# Fly.io - `fly launch --copy-config --yes` then `fly volumes create data --size 2` (if not created by launch)
app = "costumes-and-set"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  DATA_DIR = "/data"
  DATABASE_URL = "file:/data/sink.db"
  UPLOAD_DIR = "/data/uploads"
  SEED_DEMO = "true"
  CORS_ORIGIN = "*"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
